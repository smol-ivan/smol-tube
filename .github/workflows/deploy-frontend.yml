name: Deploy Frontend (Astro to S3)

on:
  push:
    branches:
      - main
    paths:
      - "packages/frontend/**" # Cambia esto por la ruta real de tu app de Astro

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Configurar Credenciales de AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2

      - name: Instalar Dependencias
        run: pnpm install

      - name: Compilar Astro
        # Asegúrate de cambiar el filtro por el nombre de tu paquete frontend en el monorepo
        run: pnpm --filter @smol-tube/frontend build

      - name: Subir archivos estáticos a S3
        # Esto toma la carpeta de salida de Astro (ej. 'dist' o 'build') y la sincroniza con tu bucket
        run: |
          aws s3 sync packages/frontend/dist s3://TU-NOMBRE-DE-BUCKET-S3 --delete

      - name: Invalidar caché de CloudFront (Opcional pero recomendado)
        # Fuerza a CloudFront a mostrar los cambios de inmediato sin esperar a que expire el caché
        run: |
          aws cloudfront create-invalidation --distribution-id TU_CLOUDFRONT_DISTRIBUTION_ID --paths "/*"
