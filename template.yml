      Principal: apigateway.amazonaws.com

  # --- 7. PLAYLIST ADD (playlistAdd) ---
  PlaylistAddFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: packages/backend/dist/
      Handler: playlistAdd.handler
      Environment:
        Variables:
          YOUTUBE_API_KEY: "{{resolve:ssm:/smol-tube/youtube-api-key}}"
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref ConnectionsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref RoomsTable
        - Statement:
