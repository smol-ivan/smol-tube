    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref MediaUpdateFunction
      Principal: apigateway.amazonaws.com

  # --- 6. BECOME LEADER (becomeLeader) ---
  BecomeLeaderFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: packages/backend/dist/
      Handler: becomeLeader.handler
      Policies:
