# ==========================================
# 4. OUTPUTS (Al final del archivo)
# ==========================================
Outputs:
  WebSocketURI:
    Description: "La URL a la que tu cliente Astro/Vite debe conectarse"
    Value:
      !Join [
        "",
        [
          "wss://",
          !Ref WebSocketApi,
          ".execute-api.",
          !Ref "AWS::Region",
          ".amazonaws.com/",
          !Ref WebSocketApiStage,
        ],
      ]
